<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140c07">
<title>Rimba Nusantara</title>
<style>
  :root {
    --arang: #140c07;   /* latar, juga warna "pahatan" */
    --kulit: #3a2314;   /* kulit wayang yang belum diterangi */
    --blencong: #e9a94b;/* nyala lampu minyak */
    --kelir: #efe0c2;   /* teks utama */
    --redup: #b89a6e;   /* teks sekunder */
    --serif: "Palatino Linotype", Palatino, "Book Antiqua", "URW Palladio L", Georgia, serif;
  }
  html, body { margin: 0; height: 100%; background: var(--arang); overflow: hidden; font-family: var(--serif); }
  #hud { position: fixed; left: 0; top: 0; width: 100%; height: 100%; }

  /* ================= LAYAR LOADING ================= */
  #load {
    position: fixed; inset: 0; z-index: 50; overflow: hidden; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 20px calc(env(safe-area-inset-bottom, 0px) + 16px);
    background: var(--arang); color: var(--kelir); transition: opacity .5s;
  }
  /* cahaya blencong: makin terang seiring progres */
  #glow {
    position: absolute; inset: 0; pointer-events: none; opacity: .15; transition: opacity .4s;
    background: radial-gradient(ellipse 65% 42% at 50% 36%, rgba(233,169,75,.30), rgba(233,169,75,0) 70%);
  }
  .stage { position: relative; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; max-width: 360px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 18px; width: 100%; text-align: center; }

  /* gunungan: sekaligus penanda progres */
  .gun { height: min(40vh, 330px); width: auto; max-width: 62vw; flex: none; overflow: visible; }
  #lit { transform: translateY(300px); transition: transform .35s ease-out; animation: nyala 2.7s steps(1, end) infinite; }
  @keyframes nyala {
    0% { opacity: 1; } 18% { opacity: .93; } 31% { opacity: 1; } 52% { opacity: .96; }
    64% { opacity: .9; } 77% { opacity: 1; } 91% { opacity: .95; } 100% { opacity: 1; }
  }

  h1 { margin: 0; font-weight: normal; font-size: clamp(30px, 9.5vw, 44px); line-height: 1.05; letter-spacing: -.01em; color: var(--kelir); }
  .sub { margin: 6px 0 0; font-size: 14px; font-style: italic; color: var(--redup); }

  .panel { width: min(320px, 84vw); box-sizing: border-box; }
  .status { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 14px; text-align: left; }
  #pct { color: var(--blencong); font-variant-numeric: tabular-nums; }
  .tip { margin-top: 14px; min-height: 3.9em; font-size: 13px; line-height: 1.5; font-style: italic; color: var(--redup); text-align: left; transition: opacity .35s; }
  .tip b { font-weight: normal; font-style: normal; color: var(--blencong); }
  #err { margin-top: 10px; color: #ff8a7a; font: 12px monospace; white-space: pre-wrap; text-align: left; }
  #err:empty { display: none; }

  /* menu utama */
  #menu { display: none; flex-direction: column; gap: 10px; }
  .ready-note { margin: 0 0 4px; font-size: 14px; font-style: italic; color: var(--redup); }
  .btn {
    appearance: none; -webkit-appearance: none; width: 100%; min-height: 52px; padding: 0 16px; border-radius: 4px;
    font: bold 18px/1 var(--serif); cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: transform .12s, background .12s;
  }
  .btn:active { transform: scale(.98); }
  .btn:focus-visible { outline: 2px solid var(--kelir); outline-offset: 3px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn-play { border: 0; color: var(--arang); background: var(--blencong); }
  .btn-play:hover { background: #f1b960; }
  .btn-new { color: var(--kelir); background: transparent; border: 1.5px solid #8a6a44; }
  .btn-new:hover { background: rgba(239,224,194,.08); }
  .panel.ready .prog { display: none; }
  .panel.ready #menu { display: flex; }

  /* layar pendek / landscape: gunungan di kiri, teks di kanan */
  @media (max-height: 520px) and (orientation: landscape) {
    .stage { flex-direction: row; max-width: 720px; gap: 36px; }
    .gun { height: min(78vh, 300px); }
    .col { align-items: flex-start; text-align: left; gap: 14px; }
  }
  @media (max-height: 420px) { .tip { display: none; } }
  @media (prefers-reduced-motion: reduce) { #lit { animation: none; } }
</style>
</head>
<body>
<canvas id="hud"></canvas>
<div id="load">
  <div id="glow"></div>

  <div class="stage">
    <!-- gunungan wayang: terisi cahaya dari bawah ke atas selama memuat -->
    <svg class="gun" id="gun" viewBox="0 0 200 300" role="progressbar" aria-label="Memuat hutan" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <defs>
        <path id="g" d="M100 8 C112 40 150 70 168 120 C184 164 182 230 162 268 C152 284 130 292 100 292 C70 292 48 284 38 268 C18 230 16 164 32 120 C50 70 88 40 100 8 Z"/>
        <clipPath id="gclip"><use href="#g"/></clipPath>
        <path id="lf" d="M0 0 C4 -6 10 -6 15 0 C10 6 4 6 0 0 Z"/>
        <g id="br" fill="none" stroke="#140c07" stroke-width="2.6" stroke-linecap="round">
          <path d="M100 182 Q82 176 70 158"/>
          <path d="M100 152 Q84 144 74 124"/>
          <path d="M100 122 Q88 112 82 92"/>
          <path d="M100 94 Q94 84 92 70"/>
          <g fill="#140c07" stroke="none">
            <use href="#lf" transform="translate(70 158) rotate(-125)"/>
            <use href="#lf" transform="translate(74 124) rotate(-120)"/>
            <use href="#lf" transform="translate(82 92) rotate(-110)"/>
            <use href="#lf" transform="translate(92 70) rotate(-100)"/>
          </g>
        </g>
      </defs>
      <!-- kulit yang belum menyala -->
      <use href="#g" fill="#3a2314" stroke="#6b4527" stroke-width="2"/>
      <!-- cahaya yang naik -->
      <g clip-path="url(#gclip)"><rect id="lit" x="0" y="0" width="200" height="300" fill="#e9a94b"/></g>
      <!-- pahatan: titik tatahan, pintu, pohon kehidupan -->
      <use href="#g" transform="translate(100 150) scale(.88) translate(-100 -150)" fill="none" stroke="#140c07" stroke-width="3" stroke-dasharray="0 7" stroke-linecap="round"/>
      <path d="M76 280 V228 Q76 200 100 200 Q124 200 124 228 V280 Z" fill="#140c07"/>
      <path d="M100 200 V58" fill="none" stroke="#140c07" stroke-width="3.2" stroke-linecap="round"/>
      <use href="#br"/>
      <use href="#br" transform="translate(200 0) scale(-1 1)"/>
      <use href="#lf" transform="translate(100 60) rotate(-90)" fill="#140c07"/>
      <path d="M100 26 L106 38 L100 50 L94 38 Z" fill="#140c07"/>
    </svg>

    <div class="col">
      <div>
        <h1>Rimba Nusantara</h1>
        <p class="sub">Bertahan hidup di jantung rimba</p>
      </div>

      <div class="panel">
        <div class="prog">
          <div class="status"><span id="msg">Memuat…</span><span id="pct">0%</span></div>
          <div class="tip" id="tipbox"><b>Tips:</b> <span id="tip"></span></div>
        </div>
        <div id="menu">
          <p class="ready-note" id="note">Hutan sudah siap.</p>
          <button type="button" class="btn btn-play" id="btnPlay">Play</button>
          <button type="button" class="btn btn-new" id="btnNew">New World</button>
        </div>
        <div id="err"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function showErr(t) { $("err").textContent += t + "\n"; }
  window.addEventListener("error", function (e) { showErr("Error: " + e.message + (e.filename ? " (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : "")); });

  // tips bergantian
  var tips = [
    "Tenaga hanya terpakai saat berlari. Berjalan santai membuatnya pulih lagi.",
    "Harimau lebih berani berburu saat malam. Nyalakan api unggun untuk berjaga.",
    "Saat gempa, lompat untuk menghindari batu yang jatuh.",
    "Badai petir? Jauhi pohon tinggi dan cari tempat terbuka.",
    "Banjir bandang datang dari sungai. Menjauhlah dan cari tanah tinggi.",
    "Jaga rasa lapar dan hausmu. Daging hasil buruan bisa dimakan.",
    "Mendaki gunung di timur laut peta memberi pemandangan rimba yang luas."
  ], ti = (Math.random() * tips.length) | 0, tipTimer;
  $("tip").textContent = tips[ti];
  tipTimer = setInterval(function () {
    var box = $("tipbox"); box.style.opacity = 0;
    setTimeout(function () { ti = (ti + 1) % tips.length; $("tip").textContent = tips[ti]; box.style.opacity = 1; }, 350);
  }, 4500);

  // memuat skrip BERURUTAN: map.js -> main.js -> multiplayer.js (multiplayer.js butuh ForestMap.net dari main.js)
  function load(src, next) {
    var s = document.createElement("script"); s.src = src + "?v=" + Date.now(); // cegah cache lama
    s.onload = next;
    s.onerror = function () { showErr("Gagal memuat " + src + ". Pastikan file ada di folder yang sama dengan index.html."); };
    document.head.appendChild(s);
  }

  // progres: gunungan terisi cahaya dari bawah, lampu latar makin terang
  function setProgress(p, teks) {
    p = Math.max(0, Math.min(1, p));
    var persen = Math.round(p * 100);
    $("lit").style.transform = "translateY(" + (300 * (1 - p)) + "px)";
    $("glow").style.opacity = .15 + .85 * p;
    $("gun").setAttribute("aria-valuenow", persen);
    $("pct").textContent = persen + "%"; $("msg").textContent = teks;
  }

  // ===== penyimpanan =====
  // Kontrak dengan game: ForestMap.getSave() mengembalikan semua progres (objek JSON, termasuk seed dunia),
  // dan ForestMap.start(canvas, save) memulihkannya. Jika belum ada, game jalan seperti biasa tanpa menyimpan.
  var SAVE_KEY = "rimba-save", KUNCI = "rimba-dunia-baru", started = false;
  function bacaSave() {
    try { var t = localStorage.getItem(SAVE_KEY); return t ? JSON.parse(t) : null; } catch (e) { return null; }
  }
  function tulisSave() {
    if (!started || typeof ForestMap.getSave !== "function") return;
    try { var d = ForestMap.getSave(); if (d) localStorage.setItem(SAVE_KEY, JSON.stringify({ t: Date.now(), d: d })); } catch (e) {}
  }
  function hapusSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
  var save = bacaSave();

  function mulai() {
    var b = $("btnPlay"); b.disabled = true; $("btnNew").disabled = true;
    try { ForestMap.start($("hud"), save ? save.d : undefined); } catch (e) { b.disabled = false; $("btnNew").disabled = false; showErr("Gagal memulai: " + e.message); return; }
    started = true;
    setInterval(tulisSave, 10000);
    window.addEventListener("pagehide", tulisSave);
    document.addEventListener("visibilitychange", function () { if (document.hidden) tulisSave(); });
    $("load").style.opacity = 0; setTimeout(function () { $("load").style.display = "none"; }, 500);
  }
  $("btnPlay").addEventListener("click", mulai);
  if (save) $("note").textContent = "Progres tersimpan ditemukan.";

  // New World: hapus progres lama, buat hutan baru (muat ulang), lalu langsung dimainkan
  function bacaBendera() {
    try { if (sessionStorage.getItem(KUNCI)) { sessionStorage.removeItem(KUNCI); return true; } } catch (e) {}
    if (location.hash === "#baru") { history.replaceState(null, "", location.pathname + location.search); return true; }
    return false;
  }
  var langsungMain = bacaBendera();
  if (langsungMain) save = null;
  var konfirmasi = false, konfTimer;
  $("btnNew").addEventListener("click", function () {
    var btn = this;
    if (save && !konfirmasi) { // dua ketukan agar progres tidak terhapus tanpa sengaja
      konfirmasi = true; btn.textContent = "Ketuk lagi untuk hapus progres";
      konfTimer = setTimeout(function () { konfirmasi = false; btn.textContent = "New World"; }, 3500);
      return;
    }
    clearTimeout(konfTimer);
    $("btnPlay").disabled = true; btn.disabled = true;
    hapusSave();
    try { sessionStorage.setItem(KUNCI, "1"); location.reload(); }
    catch (e) { location.hash = "#baru"; location.reload(); }
  });

  load("map.js", function () {
    load("main.js", function () {
      load("multiplayer.js", function () {
        if (!window.ForestMap || typeof ForestMap.start !== "function" || !ForestMap.createWorld) { showErr("map.js / main.js tidak terpasang dengan benar."); return; }
        ForestMap.generate(setProgress, function () {
          clearInterval(tipTimer);
          setProgress(1, "Selesai");
          if (langsungMain) { mulai(); return; }
          document.querySelector(".panel").classList.add("ready");
          $("btnPlay").focus({ preventScroll: true });
        });
      });
    });
  });
})();
</script>

</body>
</html>
